name: mensa-caltavuturo-staging

services:
  database:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: local_only_staging_root
      MARIADB_DATABASE: mensa_staging
      MARIADB_USER: mensa_staging
      MARIADB_PASSWORD: local_only_staging_app
    volumes:
      - staging_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: staging/Dockerfile
    depends_on:
      database:
        condition: service_healthy
    environment:
      MENSA_STAGING_ONLY: "1"
      MENSA_STAGING_DB_NAME: mensa_staging
      MENSA_STAGING_DB_HOST: database
      MENSA_STAGING_DB_USER: mensa_staging
      MENSA_STAGING_DB_PASS: local_only_staging_app
    ports:
      - "127.0.0.1:18080:80"

volumes:
  staging_mariadb_data:
