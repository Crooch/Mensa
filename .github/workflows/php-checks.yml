name: PHP quality checks

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]

jobs:
  php:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: ci_root_password
          MARIADB_DATABASE: mensa_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -uroot -pci_root_password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v5
      - name: Check PHP syntax
        run: |
          find src routes bin tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l bootstrap.php
          php -l public/index.php
          php -l bin/reset_ticket_t0.php
          bash -n bin/rilascio_prod_t0.sh
          bash -n bin/attiva_prod_t0.sh
      - name: Browser script syntax and asynchronous report regression
        run: |
          node --check public/assets/js/api.js
          node --check public/assets/js/genitore.js
          node --check public/assets/js/scuola.js
          node --check public/assets/js/operatore.js
          node --check public/assets/js/admin.js
          node --check public/assets/js/catering.js
          node --check public/assets/js/catering_settimane.js
          node --check public/assets/js/menu_foto.js
          node tests/menu_foto_ui.mjs
          node tests/catering_ui.mjs
          node tests/ui_scuola.mjs
          node tests/ui_testi.mjs
      - name: Scheduler default-off and read-only diagnostic
        run: |
          set -euo pipefail
          php bin/cron_daily.php --check > /tmp/mensa-scheduler-check.txt
          grep -q 'Scheduler: DISABILITATO' /tmp/mensa-scheduler-check.txt
          grep -q "Nessun job o accesso al database" /tmp/mensa-scheduler-check.txt
          if php bin/cron_daily.php > /tmp/mensa-scheduler-exec.txt 2>&1; then
            echo 'Scheduler executed without explicit enable switch' >&2
            exit 1
          fi
          grep -q 'Scheduler disabilitato' /tmp/mensa-scheduler-exec.txt
          if php bin/cron_daily.php 2026-10-01 > /tmp/mensa-scheduler-date.txt 2>&1; then
            echo 'Scheduler accepted a forced historical date' >&2
            exit 1
          fi
          grep -q 'Argomenti non consentiti' /tmp/mensa-scheduler-date.txt
          echo 'OK: default off, --check safe, no historical date'
      - name: Calendar regression tests
        run: php tests/calendario.php
      - name: Install MariaDB CLI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mariadb-client php-mysql
      - name: Verify additive SQL migrations on isolated database
        env:
          MYSQL_PWD: ci_root_password
        run: |
          set -euo pipefail
          DB="mariadb --host=127.0.0.1 --port=3306 --user=root --database=mensa_ci"
          $DB < database/migrations/001_schema.sql
          $DB <<'SQL'
          INSERT INTO plessi (nome) VALUES
            ('Scuola dell''Infanzia - Via Catania'),
            ('Scuola Secondaria di I grado');
          SQL
          # Dati preesistenti sintetici: verificare che le modifiche additive
          # preservino conto buoni e movimenti contabili gia' registrati.
          $DB <<'SQL'
          INSERT INTO utenti (ruolo, username, password_hash)
          VALUES ('operatore', 'verifica_preservazione_ci', 'hash_fittizio');
          INSERT INTO genitori (nome, cognome, telefono)
          VALUES ('Famiglia', 'Con dati antecedenti', '0000000000');
          INSERT INTO pool_crediti (genitore_id, plesso_id, saldo)
          SELECT g.id, p.id, 7 FROM genitori g JOIN plessi p
          WHERE g.cognome = 'Con dati antecedenti'
            AND p.nome = 'Scuola dell''Infanzia - Via Catania';
          INSERT INTO movimenti_crediti (pool_id, tipo, delta, data, utente_id, note)
          SELECT c.id, 'acquisto', 7, '2026-10-01', u.id, 'Preservazione dati CI'
          FROM pool_crediti c JOIN utenti u ON u.username = 'verifica_preservazione_ci';
          SQL
          # Il preflight deve funzionare anche sullo schema iniziale 001.
          $DB < database/preflight_readonly.sql > /tmp/preflight-before-migrations.txt
          grep -q '07_CONTABILITA_AGGREGATA' /tmp/preflight-before-migrations.txt
          grep -q '10_JOB_PER_ESITO' /tmp/preflight-before-migrations.txt
          $DB < database/migrations/002_calendario_mensa.sql
          $DB < database/migrations/002_calendario_mensa.sql
          $DB < database/migrations/003_richieste_pasta_bianco.sql
          $DB < database/migrations/003_richieste_pasta_bianco.sql
          $DB < database/migrations/004_audit_operazioni_presenze.sql
          $DB < database/migrations/004_audit_operazioni_presenze.sql
          $DB < database/migrations/005_idempotenza_acquisti.sql
          $DB < database/migrations/005_idempotenza_acquisti.sql
          $DB < database/migrations/006_menu_settimanali.sql
          $DB < database/migrations/006_menu_settimanali.sql
          $DB < database/migrations/007_storico_nomi_modelli.sql
          $DB < database/migrations/007_storico_nomi_modelli.sql
          $DB < database/migrations/008_foto_menu_settimanali.sql
          $DB < database/migrations/008_foto_menu_settimanali.sql
          $DB < database/migrations/009_intervalli_calendario.sql
          $DB < database/migrations/009_intervalli_calendario.sql
          test "$($DB --batch --skip-column-names -e 'SELECT COUNT(*) FROM information_schema.columns WHERE table_schema=DATABASE() AND table_name="eccezioni_calendario" AND column_name="giorno_fine"')" = "1"
          test "$($DB --batch --skip-column-names -e 'SELECT COUNT(*) FROM calendari_servizio')" = "2"
          test "$($DB --batch --skip-column-names -e 'SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name = "richieste_pasta_bianco"')" = "1"
          # Nessuna modifica dei record precedenti, anche eseguendo le migration due volte.
          test "$($DB --batch --skip-column-names -e 'SELECT COUNT(*) FROM movimenti_crediti WHERE note="Preservazione dati CI" AND tipo="acquisto" AND delta=7 AND data="2026-10-01" AND richiesta_id IS NULL')" = "1"
          test "$($DB --batch --skip-column-names -e 'SELECT COUNT(*) FROM pool_crediti WHERE saldo=7')" = "1"
          test "$($DB --batch --skip-column-names -e 'SELECT COUNT(*) FROM utenti WHERE username="verifica_preservazione_ci"')" = "1"
      - name: Check catering counts and pasta requests with synthetic pupils
        env:
          MYSQL_PWD: ci_root_password
          MENSA_TEST_DATABASE: mensa_ci
        run: php tests/report_integrazione.php
      - name: Menu settimanali e storico per data
        env:
          MYSQL_PWD: ci_root_password
          MENSA_TEST_DATABASE: mensa_ci
        run: php tests/menu_settimanale_integrazione.php
      - name: Verify purchase idempotency
        env:
          MYSQL_PWD: ci_root_password
          MENSA_TEST_DATABASE: mensa_ci
        run: php tests/idempotenza_acquisti.php
      - name: Prevent late declarations and duplicate credits
        env:
          MYSQL_PWD: ci_root_password
          MENSA_TEST_DATABASE: mensa_ci
        run: php tests/sicurezza_presenze.php
      - name: Prevent automatic retry after failed daily job
        env:
          MYSQL_PWD: ci_root_password
          MENSA_TEST_DATABASE: mensa_ci
        run: php tests/job_blocco_retry.php
      - name: Restrict reminder pupil names to the correct school
        env:
          MYSQL_PWD: ci_root_password
          MENSA_TEST_DATABASE: mensa_ci
        run: php tests/sollecito_privacy.php
      - name: Read-only database preflight
        env:
          MYSQL_PWD: ci_root_password
        run: |
          mariadb --host=127.0.0.1 --port=3306 --user=root --database=mensa_ci \
            --batch < database/preflight_readonly.sql > /tmp/preflight-ci.out
          test -s /tmp/preflight-ci.out
          grep -q '07_CONTABILITA_AGGREGATA' /tmp/preflight-ci.out
          grep -q '08_POOL_NON_ALLINEATI' /tmp/preflight-ci.out
          grep -q '10_JOB_PER_ESITO' /tmp/preflight-ci.out
      - name: Schema-only upgrade preserves existing synthetic data
        env:
          MYSQL_PWD: ci_root_password
        run: |
          set -euo pipefail
          ROOT="mariadb --host=127.0.0.1 --port=3306 --user=root"
          $ROOT -e "CREATE DATABASE mensa_schema_only_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
          DB="$ROOT --database=mensa_schema_only_ci --batch --skip-column-names"
          $DB < database/migrations/001_schema.sql
          $DB <<'SQL'
          INSERT INTO plessi (nome) VALUES
            ('Scuola dell''Infanzia - Via Catania'),
            ('Scuola Secondaria di I grado');
          INSERT INTO utenti (ruolo, username, password_hash)
          VALUES ('genitore', 'ci_genitore_intoccabile', 'hash_sintetico');
          INSERT INTO genitori (utente_id, nome, cognome, telefono)
          VALUES (1, 'Dati', 'Da preservare', '0000000000');
          INSERT INTO tipologie_menu (nome) VALUES ('Standard sintetico');
          INSERT INTO bambini (nome, cognome, genitore_id, tipologia_menu_id)
          VALUES ('Alunno', 'Sintetico', 1, 1);
          INSERT INTO classi_sezioni (plesso_id, nome, anno_scolastico)
          VALUES (1, 'CI Test', '2026/2027');
          INSERT INTO assegnazioni_classe (bambino_id, classe_sezione_id, data_inizio)
          VALUES (1, 1, '2026-09-01');
          INSERT INTO pool_crediti (genitore_id, plesso_id, saldo)
          VALUES (1, 1, 7);
          INSERT INTO movimenti_crediti
            (pool_id, tipo, delta, data, note)
          VALUES (1, 'acquisto', 7, '2026-10-01', 'Movimento originale CI');
          INSERT INTO presenze_giornaliere (bambino_id, data, stato_effettivo)
          VALUES (1, '2026-10-12', 'presente');
          SQL
          # Snapshot delle righe preesistenti: confronto esatto dei campi
          # di business; le nuove colonne NULL non compaiono nello snapshot.
          snapshot() {
            $DB <<'SQL'
          SELECT CONCAT_WS('|','plessi',id,nome,cutoff_orario) FROM plessi ORDER BY id;
          SELECT CONCAT_WS('|','utenti',id,ruolo,username,password_hash) FROM utenti ORDER BY id;
          SELECT CONCAT_WS('|','genitori',id,utente_id,nome,cognome,telefono) FROM genitori ORDER BY id;
          SELECT CONCAT_WS('|','bambini',id,nome,cognome,genitore_id,tipologia_menu_id) FROM bambini ORDER BY id;
          SELECT CONCAT_WS('|','classi',id,plesso_id,nome,anno_scolastico) FROM classi_sezioni ORDER BY id;
          SELECT CONCAT_WS('|','assegnazioni',id,bambino_id,classe_sezione_id,data_inizio) FROM assegnazioni_classe ORDER BY id;
          SELECT CONCAT_WS('|','pool',id,genitore_id,plesso_id,saldo) FROM pool_crediti ORDER BY id;
          SELECT CONCAT_WS('|','movimenti',id,pool_id,tipo,delta,data,note) FROM movimenti_crediti ORDER BY id;
          SELECT CONCAT_WS('|','presenze',id,bambino_id,data,stato_effettivo) FROM presenze_giornaliere ORDER BY id;
          SQL
          }
          snapshot > /tmp/schema-only-before.txt
          # Solo CREATE/ALTER: fallisci se il file contiene DML/DROP.
          if grep -Ei '^[[:space:]]*(INSERT|UPDATE|DELETE|REPLACE|TRUNCATE|DROP)[[:space:]]' \
              database/deploy/upgrade_schema_only_2026_10.sql; then
            echo "Il file schema-only contiene operazioni sui dati: STOP" >&2
            exit 1
          fi
          $DB < database/deploy/upgrade_schema_only_2026_10.sql
          snapshot > /tmp/schema-only-after.txt
          cmp /tmp/schema-only-before.txt /tmp/schema-only-after.txt
          test "$($DB -e 'SELECT COUNT(*) FROM calendari_servizio')" = "0"
          test "$($DB -e 'SELECT COUNT(*) FROM menu_settimanali')" = "0"
          test "$($DB -e "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'eccezioni_calendario' AND COLUMN_NAME = 'giorno_fine'")" = "1"
          # La seconda esecuzione non deve introdurre alcun dato né errore.
          $DB < database/deploy/upgrade_schema_only_2026_10.sql
          snapshot > /tmp/schema-only-again.txt
          cmp /tmp/schema-only-before.txt /tmp/schema-only-again.txt
          test "$($DB -e 'SELECT COUNT(*) FROM calendari_servizio')" = "0"
          echo "OK: DDL applicato due volte, nessun record di dominio alterato o importato"


      - name: T0 reset is transactional, once-only, and preserves synthetic users
        env:
          CI: "true"
          MENSA_TEST_DATABASE: mensa_ci
          MYSQL_PWD: ci_root_password
        run: |
          set -euo pipefail
          DB="mariadb --host=127.0.0.1 --port=3306 --user=root --database=mensa_ci"
          # T0 deve essere il test finale: elimina SOLO dati economici fittizi.
          before_users="$($DB --batch --skip-column-names -e 'SELECT COUNT(*) FROM utenti')"
          before_bambini="$($DB --batch --skip-column-names -e 'SELECT COUNT(*) FROM bambini')"
          before_presenze="$($DB --batch --skip-column-names -e 'SELECT COUNT(*) FROM presenze_giornaliere')"
          before_pools="$($DB --batch --skip-column-names -e 'SELECT COUNT(*) FROM pool_crediti')"
          $DB -e "INSERT INTO movimenti_crediti (pool_id, tipo, delta, data, note)
                 SELECT pc.id, 'acquisto', 5, CURRENT_DATE, 'CI t0 da cancellare'
                 FROM pool_crediti pc LIMIT 1"
          # La prova verifica che il reset NON richieda inizializzazioni di demo.
          cat > config/config.local.php <<'PHP'
          <?php
          return [
              'app' => ['maintenance_mode' => true, 'scheduler_enabled' => false],
              'db' => [
                  'host' => '127.0.0.1', 'port' => 3306, 'database' => 'mensa_ci',
                  'username' => 'root', 'password' => 'ci_root_password',
              ],
          ];
          PHP
          mariadb-dump --host=127.0.0.1 --port=3306 --user=root \
            --single-transaction --quick --routines --triggers --events \
            mensa_ci | gzip -c > /tmp/mensa-t0-ci-before.sql.gz
          test -s /tmp/mensa-t0-ci-before.sql.gz
          php bin/reset_ticket_t0.php --dry-run > /tmp/mensa-t0-dry.txt
          grep -q 'DRY-RUN' /tmp/mensa-t0-dry.txt
          php bin/reset_ticket_t0.php --execute \
            --t0="$(TZ=Europe/Rome date +%F)" \
            --backup=/tmp/mensa-t0-ci-before.sql.gz
          test "$($DB --batch --skip-column-names -e 'SELECT COUNT(*) FROM movimenti_crediti')" = "0"
          test "$($DB --batch --skip-column-names -e 'SELECT COALESCE(SUM(saldo),0) FROM pool_crediti')" = "0"
          test "$($DB --batch --skip-column-names -e 'SELECT COUNT(*) FROM pool_crediti')" = "$before_pools"
          test "$($DB --batch --skip-column-names -e 'SELECT COUNT(*) FROM utenti')" = "$before_users"
          test "$($DB --batch --skip-column-names -e 'SELECT COUNT(*) FROM bambini')" = "$before_bambini"
          test "$($DB --batch --skip-column-names -e 'SELECT COUNT(*) FROM presenze_giornaliere')" = "$before_presenze"
          if php bin/reset_ticket_t0.php --execute \
            --t0="$(TZ=Europe/Rome date +%F)" \
            --backup=/tmp/mensa-t0-ci-before.sql.gz; then
            echo 'ERRORE: secondo azzeramento consentito' >&2
            exit 1
          fi
          php -r '
            require "bootstrap.php";
            $r = new App\Repository\CreditoRepository();
            try {
                $r->registraMovimento([
                    "pool_id" => 1, "tipo" => "consumo_pasto",
                    "delta" => -1, "data" => "2000-01-01",
                ]);
                throw new RuntimeException("Movimento pre-T0 accettato");
            } catch (App\Core\HttpException $e) {
                echo "OK: movimenti pre-T0 bloccati.\n";
            }
          '
          echo "OK: T0 su dati sintetici, nessuna perdita anagrafica"
